            include 'assets/computer_in_minecraft/models/block/keyboard.json'
            include 'assets/computer_in_minecraft/models/block/mouse.json'
            include 'assets/computer_in_minecraft/models/item/desktop_computer.json'
            include 'assets/computer_in_minecraft/models/item/laptop_computer.json'
            include 'assets/computer_in_minecraft/textures/item/keyboard.png'
            include 'assets/computer_in_minecraft/textures/item/mouse.png'
            include 'assets/computer_in_minecraft/textures/item/hdmi_cable.png'
            include 'assets/computer_in_minecraft/textures/item/usb_cable.png'
            include 'data/computer_in_minecraft/loot_tables/blocks/keyboard.json'
            include 'data/computer_in_minecraft/loot_tables/blocks/mouse.json'
        }.files*.path

        if (jarEntries.size() != 38) {
            throw new GradleException("BIOS menu foundation jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyBiosMenuFoundation'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
