    group = 'verification'
    description = 'Verifies OS disc items and persistent computer disc insertion state.'
    dependsOn 'classes', 'jar', 'runSystemDiscItemSelfTest'

    doLast {
        def requiredFiles = [
                'src/main/java/com/example/vm/item/SystemDiscItem.java',
                'src/main/java/com/example/vm/item/SystemDiscDefinition.java',
                'src/main/java/com/example/vm/test/SystemDiscItemSelfTest.java',
                'src/main/resources/assets/computer_in_minecraft/models/item/ubuntu_server_disc.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/ubuntu_desktop_disc.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/windows_10_disc.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/windows_11_disc.json',
                'build/classes/java/main/com/example/vm/item/SystemDiscItem.class',
                'build/classes/java/main/com/example/vm/item/SystemDiscDefinition.class',
                'build/classes/java/main/com/example/vm/test/SystemDiscItemSelfTest.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing system disc foundation output: ${path}")
            }
        }

        def itemsText = file('src/main/java/com/example/vm/registry/ModItems.java').text
        ['UBUNTU_SERVER_DISC', 'UBUNTU_DESKTOP_DISC', 'WINDOWS_10_DISC', 'WINDOWS_11_DISC'].each { registryName ->
            if (!itemsText.contains(registryName)) {
                throw new GradleException("Missing system disc registry object ${registryName}.")
            }
        }

        def blockEntityText = file('src/main/java/com/example/vm/blockentity/ComputerBlockEntity.java').text
        ['InsertedDisc', 'insertDisc', 'ejectDisc', 'insertedDisc'].each { fragment ->
            if (!blockEntityText.contains(fragment)) {
                throw new GradleException("ComputerBlockEntity missing disc state fragment ${fragment}.")
            }
        }
        ['qemu', 'Qmp', 'ProcessBuilder'].each { forbidden ->
            if (blockEntityText.contains(forbidden)) {
                throw new GradleException("ComputerBlockEntity must not call VM/QEMU code while storing disc state.")
            }
        }

        def computerBlockText = file('src/main/java/com/example/vm/block/ComputerBlock.java').text
        if (!computerBlockText.contains('SystemDiscItem') || !computerBlockText.contains('insertSystemDisc') || !computerBlockText.contains('ComputerDiscActions.ejectIfStopped')) {
            throw new GradleException('ComputerBlock must support system disc insertion and ejection.')
        }

        def statusText = file('src/main/java/com/example/vm/computer/ComputerStatusMessage.java').text
        if (!statusText.contains('Disc: ')) {
            throw new GradleException('Computer status must expose inserted disc state.')
        }

        def langText = file('src/main/resources/assets/computer_in_minecraft/lang/en_us.json').text
        ['Ubuntu Server Disc', 'Ubuntu Desktop Disc', 'Windows 10 Disc', 'Windows 11 Disc'].each { text ->
            if (!langText.contains(text)) {
                throw new GradleException("Missing disc language entry ${text}.")
            }
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/item/SystemDiscItem.class'
            include 'com/example/vm/item/SystemDiscDefinition.class'
            include 'assets/computer_in_minecraft/models/item/ubuntu_server_disc.json'
            include 'assets/computer_in_minecraft/models/item/ubuntu_desktop_disc.json'
            include 'assets/computer_in_minecraft/models/item/windows_10_disc.json'
            include 'assets/computer_in_minecraft/models/item/windows_11_disc.json'
        }.files*.path

        if (jarEntries.size() != 6) {
            throw new GradleException("System disc foundation jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifySystemDiscInstallationFoundation'
}

