plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.register('verifyPhase2ComputerBlock') {
    group = 'verification'
    description = 'Verifies Phase 2 computer block registration outputs and resources.'
    dependsOn 'classes', 'jar'

    doLast {
        def requiredFiles = [
                'src/main/resources/assets/computer_in_minecraft/blockstates/computer_block.json',
                'src/main/resources/assets/computer_in_minecraft/models/block/computer_block.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/computer_block.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/desktop_computer.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/laptop_computer.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/computer_monitor.json',
                'src/main/resources/assets/computer_in_minecraft/models/item/hdmi_cable.json',
                'src/main/resources/assets/computer_in_minecraft/lang/en_us.json',
                'src/main/resources/data/computer_in_minecraft/loot_tables/blocks/computer_block.json',
                'src/main/resources/data/computer_in_minecraft/loot_tables/blocks/desktop_computer.json',
                'src/main/resources/data/computer_in_minecraft/loot_tables/blocks/laptop_computer.json',
                'src/main/resources/data/computer_in_minecraft/loot_tables/blocks/computer_monitor.json',
                'build/classes/java/main/com/example/vm/test/ComputerBlockGameTests.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing Phase 2 output: ${path}")
            }
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/ComputerInMinecraft.class'
            include 'com/example/vm/block/ComputerBlock.class'
            include 'assets/computer_in_minecraft/blockstates/computer_block.json'
            include 'assets/computer_in_minecraft/blockstates/desktop_computer.json'
            include 'assets/computer_in_minecraft/blockstates/laptop_computer.json'
            include 'assets/computer_in_minecraft/blockstates/computer_monitor.json'
            include 'data/computer_in_minecraft/loot_tables/blocks/computer_block.json'
            include 'data/computer_in_minecraft/loot_tables/blocks/desktop_computer.json'
            include 'data/computer_in_minecraft/loot_tables/blocks/laptop_computer.json'
            include 'data/computer_in_minecraft/loot_tables/blocks/computer_monitor.json'
        }.files*.path

        if (jarEntries.size() != 10) {
            throw new GradleException("Phase 2 jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyPhase2ComputerBlock'
}

tasks.register('verifyPhase3ComputerDataSystem') {
    group = 'verification'
    description = 'Verifies Phase 3 computer block entity data outputs and VM independence.'
    dependsOn 'classes', 'jar'

    doLast {
        def requiredFiles = [
                'src/main/java/com/example/vm/blockentity/ComputerBlockEntity.java',
                'src/main/java/com/example/vm/computer/ComputerHardwareConfiguration.java',
                'src/main/java/com/example/vm/registry/ModBlockEntities.java',
                'src/main/resources/assets/computer_in_minecraft/defaults/computer.json',
                'build/classes/java/main/com/example/vm/blockentity/ComputerBlockEntity.class',
                'build/classes/java/main/com/example/vm/computer/ComputerHardwareConfiguration.class',
                'build/classes/java/main/com/example/vm/registry/ModBlockEntities.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing Phase 3 output: ${path}")
            }
        }

        def defaultConfig = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/computer_in_minecraft/defaults/computer.json'))
        if (defaultConfig.id != 'computer001' || defaultConfig.cpu != 4 || defaultConfig.memory != 4096 || defaultConfig.disk != 'computer001.qcow2') {
            throw new GradleException('Default computer.json does not match the Phase 3 data contract.')
        }

        def forbiddenPatterns = ['qemu', 'VirtualMachineBackend', 'LocalQemuBackend']
        fileTree('src/main/java/com/example/vm').matching {
            include 'blockentity/**/*.java'
            include 'computer/**/*.java'
            include 'registry/**/*.java'
        }.files.each { sourceFile ->
            def text = sourceFile.text.toLowerCase(Locale.ROOT)
            forbiddenPatterns.each { pattern ->
                if (text.contains(pattern.toLowerCase(Locale.ROOT))) {
                    throw new GradleException("Phase 3 must not reference VM backend code: ${sourceFile}")
                }
            }
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/blockentity/ComputerBlockEntity.class'
            include 'com/example/vm/computer/ComputerHardwareConfiguration.class'
            include 'com/example/vm/registry/ModBlockEntities.class'
            include 'assets/computer_in_minecraft/defaults/computer.json'
        }.files*.path

        if (jarEntries.size() != 4) {
            throw new GradleException("Phase 3 jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyPhase3ComputerDataSystem'
}

tasks.register('runVirtualMachineManagerSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Phase 4 VM manager self-test without launching external VM processes.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.vm.test.VirtualMachineManagerSelfTest'
}

tasks.register('verifyPhase4VmManager') {
    group = 'verification'
    description = 'Verifies Phase 4 VM manager abstractions and no-QEMU boundary.'
    dependsOn 'classes', 'jar', 'runVirtualMachineManagerSelfTest'

    doLast {
        def requiredFiles = [
                'src/main/java/com/example/vm/vm/VirtualMachineState.java',
                'src/main/java/com/example/vm/vm/VirtualMachineDescriptor.java',
                'src/main/java/com/example/vm/vm/VirtualMachineHandle.java',
                'src/main/java/com/example/vm/vm/VirtualMachineManager.java',
                'src/main/java/com/example/vm/vm/backend/VirtualMachineBackend.java',
                'src/main/java/com/example/vm/vm/backend/NoopVirtualMachineBackend.java',
                'build/classes/java/main/com/example/vm/vm/VirtualMachineManager.class',
                'build/classes/java/main/com/example/vm/vm/backend/VirtualMachineBackend.class',
                'build/classes/java/main/com/example/vm/test/VirtualMachineManagerSelfTest.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing Phase 4 output: ${path}")
            }
        }

        def forbiddenPatterns = ['ProcessBuilder', 'Runtime.getRuntime', 'qemu-system', 'qemu-img']
        fileTree('src/main/java').matching {
            include '**/*.java'
            exclude 'com/example/vm/vm/backend/local/**/*.java'
            exclude 'com/example/vm/config/ComputerRuntimeConfig.java'
            exclude 'com/example/vm/config/ComputerRuntimePreflight.java'
            exclude 'com/example/vm/test/LocalQemuBackendSelfTest.java'
        }.files.each { sourceFile ->
            def text = sourceFile.text
            forbiddenPatterns.each { pattern ->
                if (text.contains(pattern)) {
                    throw new GradleException("Phase 4 must not start external processes or call QEMU: ${sourceFile}")
                }
            }
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/vm/VirtualMachineManager.class'
            include 'com/example/vm/vm/backend/VirtualMachineBackend.class'
            include 'com/example/vm/vm/backend/NoopVirtualMachineBackend.class'
            include 'com/example/vm/vm/VirtualMachineState.class'
        }.files*.path

        if (jarEntries.size() != 4) {
            throw new GradleException("Phase 4 jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyPhase4VmManager'
}

tasks.register('runLocalQemuBackendSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 5 LocalQemuBackend command construction without launching QEMU.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.vm.test.LocalQemuBackendSelfTest'
}

tasks.register('verifyPhase5LocalQemuBackend') {
    group = 'verification'
    description = 'Verifies Phase 5 LocalQemuBackend classes and default runtime safety.'
    dependsOn 'classes', 'jar', 'runLocalQemuBackendSelfTest'

    doLast {
        def requiredFiles = [
                'src/main/java/com/example/vm/vm/backend/local/LocalQemuConfiguration.java',
                'src/main/java/com/example/vm/vm/backend/local/QemuCommandBuilder.java',
                'src/main/java/com/example/vm/vm/backend/local/LocalQemuBackend.java',
                'build/classes/java/main/com/example/vm/vm/backend/local/LocalQemuConfiguration.class',
                'build/classes/java/main/com/example/vm/vm/backend/local/QemuCommandBuilder.class',
                'build/classes/java/main/com/example/vm/vm/backend/local/LocalQemuBackend.class',
                'build/classes/java/main/com/example/vm/test/LocalQemuBackendSelfTest.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing Phase 5 output: ${path}")
            }
        }

        def entryPointText = file('src/main/java/com/example/vm/ComputerInMinecraft.java').text
        if (entryPointText.contains('LocalQemuBackend')) {
            throw new GradleException('LocalQemuBackend must not be the default mod backend in Phase 5.')
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/vm/backend/local/LocalQemuConfiguration.class'
            include 'com/example/vm/vm/backend/local/QemuCommandBuilder.class'
            include 'com/example/vm/vm/backend/local/LocalQemuBackend.class'
        }.files*.path

        if (jarEntries.size() != 3) {
            throw new GradleException("Phase 5 jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyPhase5LocalQemuBackend'
}

tasks.register('runComputerStatusMessageSelfTest', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 6 in-game computer status message formatting.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.vm.test.ComputerStatusMessageSelfTest'
}

tasks.register('verifyPhase6GameplayVmStatus') {
    group = 'verification'
    description = 'Verifies Phase 6 gameplay-visible VM status interaction.'
    dependsOn 'classes', 'jar', 'runComputerStatusMessageSelfTest'

    doLast {
        def requiredFiles = [
                'src/main/java/com/example/vm/computer/ComputerStatusMessage.java',
                'src/main/java/com/example/vm/test/ComputerStatusMessageSelfTest.java',
                'build/classes/java/main/com/example/vm/computer/ComputerStatusMessage.class',
                'build/classes/java/main/com/example/vm/test/ComputerStatusMessageSelfTest.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing Phase 6 output: ${path}")
            }
        }

        def computerBlockText = file('src/main/java/com/example/vm/block/ComputerBlock.java').text
        if (!computerBlockText.contains('public InteractionResult use(')) {
            throw new GradleException('ComputerBlock must expose a right-click interaction for Phase 6 gameplay verification.')
        }
        def biosActionsPhase6Text = file('src/main/java/com/example/vm/computer/ComputerBiosActions.java').text
        if (!computerBlockText.contains('VM_MANAGER.getState') || !biosActionsPhase6Text.contains('VM_MANAGER.create')) {
            throw new GradleException('ComputerBlock must expose VM status while BIOS actions route registration through VirtualMachineManager.')
        }
        if (computerBlockText.contains('LocalQemuBackend')) {
            throw new GradleException('ComputerBlock must not directly depend on LocalQemuBackend.')
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/computer/ComputerStatusMessage.class'
        }.files*.path

        if (jarEntries.size() != 1) {
            throw new GradleException("Phase 6 jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyPhase6GameplayVmStatus'
}

