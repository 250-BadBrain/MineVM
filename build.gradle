tasks.register('verifyControlledLocalQemuRuntime') {
    group = 'verification'
    description = 'Verifies opt-in LocalQemuBackend runtime wiring and in-game VM toggle behavior.'
    dependsOn 'classes', 'jar', 'runComputerRuntimeConfigSelfTest', 'runComputerRuntimePreflightSelfTest'

    doLast {
        def requiredFiles = [
                'src/main/java/com/example/vm/config/ComputerRuntimeConfig.java',
                'src/main/java/com/example/vm/config/ComputerRuntimePreflight.java',
                'src/main/java/com/example/vm/test/ComputerRuntimeConfigSelfTest.java',
                'src/main/java/com/example/vm/test/ComputerRuntimePreflightSelfTest.java',
                'build/classes/java/main/com/example/vm/config/ComputerRuntimeConfig.class',
                'build/classes/java/main/com/example/vm/config/ComputerRuntimePreflight.class',
                'build/classes/java/main/com/example/vm/test/ComputerRuntimeConfigSelfTest.class',
                'build/classes/java/main/com/example/vm/test/ComputerRuntimePreflightSelfTest.class'
        ]

        requiredFiles.each { path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing controlled local QEMU runtime output: ${path}")
            }
        }

        def configText = file('src/main/java/com/example/vm/config/ComputerRuntimeConfig.java').text
        if (!configText.contains('DEFAULT_ENABLE_LOCAL_QEMU = false') || !configText.contains('define("enableLocalQemu", DEFAULT_ENABLE_LOCAL_QEMU)')) {
            throw new GradleException('Local QEMU must remain disabled by default.')
        }
        if (!configText.contains('new LocalQemuBackend') || !configText.contains('new NoopVirtualMachineBackend')) {
            throw new GradleException('Runtime config must choose between Noop and LocalQemu backends.')
        }
        ['localQemuEnabled', 'qemuSystemPath', 'qemuImgPath', 'vmStorageDirectory', 'accelerator'].each { marker ->
            if (!configText.contains(marker)) {
                throw new GradleException("Runtime config missing read-only preflight marker ${marker}.")
            }
        }
        def preflightText = file('src/main/java/com/example/vm/config/ComputerRuntimePreflight.java').text
        ['validatePowerOn', 'validateSystemDiscBoot', 'Local QEMU backend is disabled in config.', 'System disc ISO does not exist'].each { marker ->
            if (!preflightText.contains(marker)) {
                throw new GradleException("Runtime preflight missing marker ${marker}.")
            }
        }

        def managerText = file('src/main/java/com/example/vm/vm/VirtualMachineManager.java').text
        if (!managerText.contains('replaceBackend')) {
            throw new GradleException('VirtualMachineManager must support backend replacement for runtime config changes.')
        }

        def computerBlockText = file('src/main/java/com/example/vm/block/ComputerBlock.java').text
        def biosActionsForRuntimeText = file('src/main/java/com/example/vm/computer/ComputerBiosActions.java').text
        def powerActionsForRuntimeText = file('src/main/java/com/example/vm/computer/ComputerPowerActions.java').text
        if (!computerBlockText.contains('Power on | BIOS ready') || !biosActionsForRuntimeText.contains('VM_MANAGER.start') || !powerActionsForRuntimeText.contains('VM_MANAGER.stop') || !biosActionsForRuntimeText.contains('ComputerRuntimePreflight.validateSystemDiscBoot')) {
            throw new GradleException('Physical power must open BIOS while BIOS actions expose VM start/stop through the VM manager.')
        }
        if (computerBlockText.contains('LocalQemuBackend')) {
            throw new GradleException('ComputerBlock must not directly depend on LocalQemuBackend.')
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def jarEntries = zipTree(jarFile).matching {
            include 'com/example/vm/config/ComputerRuntimeConfig.class'
            include 'com/example/vm/config/ComputerRuntimePreflight.class'
        }.files*.path

        if (jarEntries.size() != 2) {
            throw new GradleException("Controlled local QEMU runtime jar verification failed for ${jarFile}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyControlledLocalQemuRuntime'
}

