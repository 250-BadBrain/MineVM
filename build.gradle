tasks.register('verifyComputerDeviceInteractionArchitecture') {
    group = 'verification'
    description = 'Verifies form-factor-aware computer interaction architecture.'
    dependsOn 'classes', 'jar', 'runComputerInteractionResolverSelfTest', 'runComputerFootprintSelfTest'

    doLast {
        def requiredFiles = [
